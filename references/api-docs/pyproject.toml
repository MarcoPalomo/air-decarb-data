[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airly"
version = "0.1.0"
description = "Python client for the Airly air quality API v2"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock",
    "responses",          # HTTP mocking for tests
]
pipeline = [
    "pandas>=2.0",
    "pyarrow>=14",        # Parquet sink
]
