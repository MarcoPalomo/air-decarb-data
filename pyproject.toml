[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "air-decarb-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Sources air quality
    "aeolus @ git+https://github.com/southlondonscientific/aeolus.git@v0.4.5.4",
    "openaq>=2.0.0",
    "openmeteo-requests>=1.2.0",
    "requests>=2.32.0",

    # Compute
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pandas>=3.0.0",
    "pyarrow>=16.0.0",

    # Iceberg + stockage
    "pyiceberg[s3fs]>=0.7.0",
    "boto3>=1.34.0",

    # Orchestration
    "prefect>=3.0.0,<4.0",
    "prefect-kubernetes>=0.4.0",

    # MLflow
    "mlflow>=3.0.0",

    # Base de données
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.0",

    # Géospatial
    "pyproj>=3.6.0",
]

[project.optional-dependencies]
cams = [
    "cdsapi>=0.7.0",
    "xarray>=2024.6.0",
    "netCDF4>=1.7.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "freezegun>=1.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
markers = [
    "integration: tests requiring network or external services",
    "slow: tests taking more than 5 seconds",
]
addopts = "--tb=short"

[tool.coverage.run]
source = ["pipeline"]
omit = ["pipeline/tests/*"]
